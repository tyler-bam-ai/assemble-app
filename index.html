<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beam</title>
<style>
  body { background:#0e1116; color:#e8edf4; font:16px -apple-system,sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .card { text-align:center; max-width:420px; padding:24px; }
  a { color:#4f8ef7; }
  .dim { color:#8b96a5; font-size:14px; }
</style>
</head>
<body>
<div class="card">
  <h1>Beam</h1>
  <p id="msg">Connecting you to the meeting…</p>
  <p class="dim" id="sub"></p>
</div>
<script>
// Stable Beam link: forwards to wherever the Beam server currently lives.
// Path rides in the hash: https://…/beam-app/#/r/room-code
(async () => {
  const target = location.hash.slice(1) || '/';
  try {
    const r = await fetch('public-url.json?t=' + Date.now(), { cache: 'no-store' });
    const { url } = await r.json();
    if (!url) throw new Error('no url');
    const dest = url.replace(/\/$/, '') + target;
    document.getElementById('sub').textContent = dest;
    location.replace(dest);
  } catch (e) {
    document.getElementById('msg').innerHTML =
      'The Beam server looks offline right now.<br>Try again in a minute, or get the app:';
    document.getElementById('sub').innerHTML =
      '<a href="https://github.com/tyler-bam-ai/beam-app">github.com/tyler-bam-ai/beam-app</a>';
  }
})();
</script>
</body>
</html>
